[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consensus-robustness"
version = "0.1.0"
description = "Deterministic discrete-event simulator for testing safety and liveness of consensus protocols (Raft, Tendermint-style BFT) under faults"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Urban Ogrinec" }]
requires-python = ">=3.11"
dependencies = ["hypothesis>=6.100"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
plot = ["matplotlib>=3.8"]

[project.scripts]
consensus-robustness = "consensus_robustness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running sweeps (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters (Δ) in strings and comments are intentional
